# profile.yaml — профиль кандидата: что ищем, под что оцениваем вакансии.
# Это единственный файл, который реально определяет качество скоринга.
# Чем конкретнее — тем точнее фильтры и оценка ИИ.

candidate:
  # Кто ты — 2-4 предложения, ИИ использует это как контекст для оценки "мандата"
  summary: >
    Например: Senior Product Manager с 6 годами опыта в B2C-финтехе.
    Сильные стороны: 0-to-1 продукты, аналитика, работа с командой разработки.
    Ищу роль с полным владением продуктовым направлением, не "фича-фабрику".

  # Желаемые роли/титулы (используются и как ключевые слова поиска на hh.ru)
  target_titles:
    - "Product Manager"
    - "Senior Product Manager"
    - "Head of Product"

  # Уровень (junior/middle/senior/lead/head) — для отсечения совсем не тех вакансий
  seniority: ["senior", "lead", "head"]

  # Формат работы
  work_format: ["remote", "hybrid"]   # remote / hybrid / office

  # География (для гео-стопа в детерминированных фильтрах)
  locations_allowed:
    - "Москва"
    - "Санкт-Петербург"
    - "Удалённо"

  # Вилка (не публикуется в вакансиях явно почти никогда, используется мягко)
  salary_min_rub: 300000

# ---- Слой 1: детерминированные фильтры (без ИИ) ----
filters:
  # Роли/функции, которые НЕ подходят категорически (режем до вызова модели)
  anti_functions:
    - "информационная безопасность"
    - "бухгалтер"
    - "юрист"
    - "HR-специалист"
    - "инженер по продажам оборудования"

  # Отрасли, которые не подходят (уточняй под свой кейс — иногда одно и то же
  # слово в разных компаниях означает разное, см. пример в блюпринте)
  anti_industries:
    - "тяжёлая промышленность"
    - "сельское хозяйство"

  # Стоп-слова в заголовке/описании — явный шум, а не вакансия
  noise_keywords:
    - "ищу работу"          # это пост-резюме, не вакансия
    - "резюме"
    - "реклама"
    - "подборка каналов"
    - "розыгрыш"

# ---- Слой 2: рубрика ИИ-оценки ----
# Каждый пункт — под-оценка 0..N, сумма которых даёт итоговый балл.
# Правь под свои приоритеты — что важнее, тому больше max_score.
scoring_rubric:
  - key: "mandate"       # реальная зона ответственности, а не название
    label: "Мандат / уровень ответственности"
    max_score: 25
  - key: "seniority"
    label: "Соответствие уровню"
    max_score: 20
  - key: "industry"
    label: "Отрасль / продукт"
    max_score: 15
  - key: "scale"
    label: "Масштаб компании/продукта"
    max_score: 15
  - key: "geo"
    label: "География / формат работы"
    max_score: 15
  - key: "growth"
    label: "Потенциал роста/обучения"
    max_score: 10

# Пороги вердикта (сумма по рубрике из максимум 100)
thresholds:
  fit: 70        # "подходит" — генерируем сопроводительное письмо
  borderline: 50 # "на грани" — показываем в дайджесте без письма
  # ниже borderline — "не подходит", не показываем (либо показываем свёрнуто)

# Красные флаги — если хоть один совпал, вакансия сразу уходит в "не подходит"
# независимо от суммы баллов
red_flags:
  - "серая зарплата"
  - "испытательный срок без оформления"
  - "нужен свой ноутбук"
